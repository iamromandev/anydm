services:
  db:
    image: postgres:latest
    hostname: db-anydm-api
    container_name: db-anydm-api
    restart: on-failure
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5430:5432"
    networks:
      - db
    volumes:
      - db:/var/lib/postgresql
    command: postgres -c client_encoding=utf8
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      start_period: 10s
      interval: 5s
      timeout: 3s
      retries: 3

  torrent:
    image: ikatson/rqbit:9.0.1
    hostname: torrent-anydm-api
    container_name: torrent-anydm-api
    restart: unless-stopped
    ports:
      # rqbit's control API has NO authentication. Loopback only, never
      # 0.0.0.0. 8031 on the host so `make run` can reach it, beside the API's
      # own 8030; 3030 is rqbit's default inside the network.
      - "127.0.0.1:8031:3030"
      # Incoming peer connections, TCP and uTP. Without these the swarm is
      # outbound-only and measurably slower.
      - "4240:4240/tcp"
      - "4240:4240/udp"
    networks:
      - server
    volumes:
      # The same named volume the API mounts, at the same path, so a path
      # rqbit writes resolves unchanged when the API serves that file.
      - download:/workdir/download
      - torrent:/session
    # Global options come before the subcommand; the output folder is
    # positional. UPnP cannot work from inside a container, so it is off.
    command: >
      --http-api-listen-addr 0.0.0.0:3030
      --disable-upnp-port-forward
      server start
      --persistence-location /session
      /workdir/download/torrent

  server:
    hostname: server-anydm-api
    container_name: server-anydm-api
    restart: unless-stopped
    build:
      context: .
      dockerfile: dockerfile
      target: local
      args:
        ENV: local
        WORK_DIR: /workdir
        INSTALL_DIR: /opt/install
        PW_DIR: /pwdir
    ports:
      - "8030:8000"
    volumes:
      - .:/workdir
      - download:/workdir/download
    networks:
      - db
      - server
    depends_on:
      db:
        condition: service_healthy
      torrent:
        condition: service_started
    command: >
      bash -c "python -m scripts.migrate && uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload --loop uvloop"


networks:
  db:
    name: db-anydm-api
    driver: bridge
  server:
    name: server-anydm-api
    driver: bridge


volumes:
  db:
    name: db-anydm-api
  download:
    name: download-anydm-api
  torrent:
    name: torrent-anydm-api
