name: CI

on:
    push:
        branches: [main, dev]
    pull_request:

jobs:
    api:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: api
        steps:
            - uses: actions/checkout@v4
            - uses: astral-sh/setup-uv@v5
              with:
                  enable-cache: true
            - run: uv python install 3.15.0
            - run: uv sync
            - run: uvx ruff check
            - run: uv run ty check
            # Everything that needs nothing but Python. The suite that needs a
            # database runs locally: `make api-test-all`.
            - run: uv run pytest

    ui:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ui
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
            - run: bun install --frozen-lockfile
            - run: bun run web:format.check
            - run: bun run web:check
            - run: bun run web:test
            - run: bun run web:build
            - run: bun run ext:format.check
            - run: bun run ext:check
            - run: bun run ext:test
            - run: bun run ext:build

    cross:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            # Caches ~/.gradle/caches and ~/.gradle/wrapper, keyed on these files.
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 25
                  cache: gradle
                  cache-dependency-path: |
                      cross/**/*.gradle*
                      cross/gradle/libs.versions.toml
            # The global hotkey library (jnativehook) links against X11 and exits the JVM without a display, so the
            # runner gets its libraries and a virtual display.
            - run: |
                  sudo apt-get update
                  sudo apt-get install -y xvfb libx11-6 libx11-xcb1 libxt6t64 libxtst6 libxi6 libxinerama1 libxkbcommon-x11-0 libxkbfile1
            # ktlint, tests, schema migration verification and checkDesktopNatives. The tests use
            # local servers only.
            - run: xvfb-run -a make cross-check
