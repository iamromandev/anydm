[versions]
kotlin = "2.4.20"
compose = "1.12.1"
# Compose Material 3 versions on its own now; 1.9.0 is what Compose 1.12.1 pins.
compose-material3 = "1.9.0"
ktor = "3.6.0"
coroutines = "1.11.0"
serialization = "1.11.0"
kotlinter = "5.7.0"
sqldelight = "2.4.1"
kotest = "6.2.6"
# Ktor 3.6.0 already brings this version; declared because engine paths are kotlinx.io.files.Path.
kotlinx-io = "0.9.1"
# HTTP for direct downloads (#567): OkHttp on JVM and Android; mockwebserver3 serves the fault-injecting tests.
okhttp = "5.5.0"
# Windows drive types for the Recycle Bin guard (FIL-09); more native calls come with #543 and #544.
jna = "5.17.0"
# BitTorrent (#541): libtorrent 2.1 through libtorrent4j. Its Java API goes in jvmCommon; the native library is per OS and
# goes where the app is built for that OS. The library doesn't unpack it from the jar: TorrentNatives does.
libtorrent4j = "2.1.0-39"

[libraries]
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-material3" }
compose-ui-test = { module = "org.jetbrains.compose.ui:ui-test-junit4", version.ref = "compose" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-io-core = { module = "org.jetbrains.kotlinx:kotlinx-io-core", version.ref = "kotlinx-io" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
# SQLDelight on :shared (#549); its Gradle plugin adds the runtime itself.
sqldelight-sqlite-driver = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotest-property = { module = "io.kotest:kotest-property", version.ref = "kotest" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
jna-platform = { module = "net.java.dev.jna:jna-platform", version.ref = "jna" }
libtorrent4j = { module = "org.libtorrent4j:libtorrent4j", version.ref = "libtorrent4j" }
libtorrent4j-macos = { module = "org.libtorrent4j:libtorrent4j-macos", version.ref = "libtorrent4j" }
libtorrent4j-linux = { module = "org.libtorrent4j:libtorrent4j-linux", version.ref = "libtorrent4j" }
libtorrent4j-windows = { module = "org.libtorrent4j:libtorrent4j-windows", version.ref = "libtorrent4j" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "okhttp" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose = { id = "org.jetbrains.compose", version.ref = "compose" }
kotlinter = { id = "org.jmailen.kotlinter", version.ref = "kotlinter" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
